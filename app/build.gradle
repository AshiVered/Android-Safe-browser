plugins {
    id 'com.android.application'
}

android {
    namespace 'aiv.ashivered.safebrowser'
    compileSdk 35

    defaultConfig {
        applicationId 'aiv.ashivered.safebrowser'
        minSdk 24
        targetSdk 35
        versionCode 12
        versionName '5.0'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // NOTE: splits.abi is intentionally NOT defined here.
    // When building an AAB for Google Play, Play Delivery splits by ABI automatically.
    // Defining splits.abi here conflicts with AAB delivery and causes GeckoView to
    // crash with SIGSEGV (null pointer in native launcher thread) on launch.

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildToolsVersion = "34.0.0"
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE']
        }
        // GeckoView loads native .so files directly from the zip path
        // (e.g. split_config.arm64_v8a.apk!/lib/arm64-v8a/libxul.so).
        // dlopen() on a zip path requires the file to be UNCOMPRESSED and
        // page-aligned. useLegacyPackaging=false (the default for modern AGP)
        // stores .so files uncompressed. useLegacyPackaging=true would compress
        // them -> dlopen returns null -> SIGSEGV at address 0x0.
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // GeckoView (not geckoview-fat for smaller size)
    implementation 'org.mozilla.geckoview:geckoview:136.0.20250227124745'
}
